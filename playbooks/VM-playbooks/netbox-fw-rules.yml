---
- name: Configure NetBox firewall rules
  hosts: netbox
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Update packages
      ansible.builtin.apt:
        name: "*"
        state: latest

  tasks:
    - name: Disable UFW before making changes
      community.general.ufw:
        state: disabled

    - name: Enable UFW logging
      community.general.ufw:
        logging: "on"

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Allow CheckMK agent
      community.general.ufw:
        rule: allow
        port: "6556"
        proto: tcp

    - name: Enable UFW with default deny policy
      community.general.ufw:
        state: enabled
        policy: deny
